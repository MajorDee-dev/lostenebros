<html lang="fr"><head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

</head><body>
<title>Los Ténébros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne façon tableau de score de bar, gros boutons pour un pouce un peu bourré, onglets en bas. */
:root {
  /* DA « Sceaux de cire » (Messe noire) : noir de crypte, cire rouge, lueur de bougie */
  --bg: #070303;        /* noir de crypte */
  --surface: #1a100e;
  --surface-2: #26170f;
  --line: #3a2420;
  --fg: #ece0cf;
  --muted: #a08878;
  --lumiere: #ecb35c;   /* la flamme de bougie : points, victoires */
  --tenebres: #d23a3a;  /* la cire / le sang : gamelles, culs secs */
  --on-accent: #1a0e06;
  --wax: radial-gradient(circle at 35% 30%, #e0484a, #a3161b 58%, #6e0c10 100%);
  --wax-edge: #5a0a0d;
  --font-display: "Pirata One", "UnifrakturCook", Georgia, serif;
  --font-ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: radial-gradient(38% 26% at 6% 100%, rgba(255,160,60,.22), transparent 70%) fixed, radial-gradient(38% 26% at 94% 100%, rgba(255,160,60,.22), transparent 70%) fixed, linear-gradient(#140908, var(--bg) 60%) fixed; background-color: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lumiere); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; letter-spacing: .01em; margin: 0; }
.brand span { color: var(--tenebres); }
.brand { display: flex; align-items: center; gap: 7px; font-size: 1.9rem; white-space: nowrap; }
.topl { min-width: 0; } /* Intro : un toucher pour entrer dans le salon */
.intro { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; text-align: center; cursor: pointer;
  background: radial-gradient(45% 30% at 50% 42%, rgba(255,150,60,.16), transparent 70%), radial-gradient(40% 28% at 8% 100%, rgba(255,160,60,.22), transparent 70%), radial-gradient(40% 28% at 92% 100%, rgba(255,160,60,.22), transparent 70%), var(--bg);
  transition: opacity .55s ease, transform .55s ease; }
.intro.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
.intro .in-wrap { display: grid; justify-items: center; gap: 18px; padding: 24px; }
.intro .in-seal { width: 200px; height: 200px; overflow: visible;
  animation: in-stamp .7s cubic-bezier(.2,1.6,.4,1) both .15s; }
.intro .in-title { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; margin: 0; color: var(--fg); animation: in-fade .8s ease both .7s; }
.intro .in-title span { color: var(--tenebres); }
.intro .in-sub { font-family: var(--font-ui); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-size: .95rem; animation: in-fade .8s ease both 1s; }
.intro .in-tap { margin-top: 26px; font-family: var(--font-ui); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--lumiere); font-size: 1.05rem; animation: in-fade .6s ease both 1.4s, in-pulse 1.8s ease-in-out infinite 2s; }
.intro.out .in-seal { animation: in-break .5s ease forwards; }
@keyframes in-stamp { from { transform: scale(2.4) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes in-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes in-pulse { 50% { opacity: .45; } }
@keyframes in-break { to { transform: scale(.6) rotate(18deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .intro *, .intro { animation: none !important; transition: opacity .2s !important; } }
.more details { border-top: 1px solid var(--line); padding: 10px 0; }
.more summary { font-family: var(--font-ui); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-size: .95rem; cursor: pointer; padding: 4px 0; }
.more details[open] summary { margin-bottom: 10px; }
.recap-th { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-ui); font-weight: 600; font-size: 1.1rem; }
.recap-th .btn { min-width: 48px; font-size: 1.4rem; padding: 6px 12px; }
.center { text-align: center; }
.recap-img { touch-action: pan-y; user-select: none; -webkit-user-select: none; display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line); margin: 10px 0 12px; }
.sync { font-size: .68rem; max-width: 6.5em; } .sync:empty { display: none; }
.brand .seal { flex: none; width: 30px; height: 30px; border-radius: 47% 53% 50% 48% / 52% 46% 54% 48%; background: var(--wax); color: #f3c9b8; font-size: 1rem; display: grid; place-items: center; box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 0 0 3px rgba(110,12,16,.55); text-shadow: 0 -1px 0 rgba(0,0,0,.4); }
.sync { white-space: nowrap; font-family: var(--font-ui); font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; text-align: right; }
.sync.off { color: var(--tenebres); }

h2 { font-family: var(--font-ui); font-weight: 700; font-size: 1rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; line-height: 1.05; text-wrap: balance; }
section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font-ui); font-weight: 700; }

.btn { font-family: var(--font-ui); font-weight: 600; font-size: 1.05rem; letter-spacing: .03em; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 16px; min-height: 48px; }
.btn.primary { background: var(--wax); color: #fbeadb; border-color: var(--wax-edge); box-shadow: 0 2px 0 var(--wax-edge), inset 0 1px 0 rgba(255,255,255,.18); text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.danger { border-color: var(--tenebres); color: var(--tenebres); background: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: default; }

.chip { font-family: var(--font-ui); font-weight: 600; font-size: 1.05rem; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 42px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.add-player { display: flex; gap: 8px; }
.add-player input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; }

/* Classement */
.board { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.board li { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.board li:first-child { border-top: 0; }
.board .rank { font-family: var(--font-ui); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.board .who { font-family: var(--font-ui); font-weight: 600; font-size: 1.15rem; min-width: 0; overflow-wrap: anywhere; }
.board .val { font-family: var(--font-ui); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.board.lum li:first-child .val, .board.lum li:first-child .who { color: var(--lumiere); }
.board.ten li:first-child .val, .board.ten li:first-child .who { color: var(--tenebres); }
.board .unit { font-size: .8rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; color: var(--muted); }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 10px; font-family: var(--font-ui); font-weight: 600; font-size: 1rem; letter-spacing: .04em; min-height: 44px; }
.seg button.on.l { background: var(--lumiere); color: var(--on-accent); }
.seg button.on.t { background: var(--tenebres); color: var(--fg); }

/* Jeux */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.game { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 76px; }
.game { position: relative; padding-right: 62px; border-radius: 4px; }
/* chaque jeu porte son sceau de cire, le dessin du jeu gravé dedans */
.game .gi { position: absolute; right: 9px; top: 9px; font-style: normal; font-size: 1.35rem; width: 44px; height: 44px; border-radius: 47% 53% 50% 48% / 52% 46% 54% 48%; background: var(--wax); display: grid; place-items: center; box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 0 0 3px rgba(110,12,16,.55), inset 0 0 0 5px rgba(255,140,120,.12); filter: none; }
.game .gi .lg { width: 31px; height: 31px; filter: drop-shadow(0 1px 0 rgba(60,0,0,.8)) drop-shadow(0 -1px 0 rgba(255,200,180,.25)); }
.game .gi .em { filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.game b { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; line-height: 1.05; }
.game span { font-size: .8rem; color: var(--muted); }

.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.history li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border-radius: 10px; }
.history li .podium { color: var(--muted); font-size: .9rem; text-align: right; min-width: 0; }

/* Partie */
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.p { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; gap: 6px; transition: transform .08s; }
.p:active { transform: scale(.97); }
.p .n { font-family: var(--font-ui); font-weight: 700; font-size: 1.3rem; line-height: 1.1; overflow-wrap: anywhere; }
.p .c { font-family: var(--font-ui); font-weight: 700; font-size: 1.9rem; color: var(--tenebres); font-variant-numeric: tabular-nums; line-height: 1; }
.p .c small { font-size: .85rem; color: var(--muted); font-weight: 500; }
.p.sel { border-color: var(--lumiere); background: var(--surface-2); }
.p .place { position: absolute; top: 10px; right: 12px; font-family: var(--font-display); font-size: 1.8rem; color: var(--lumiere); line-height: 1; }
.p.flash { animation: flash .45s; }
@keyframes flash { from { background: var(--tenebres); } to { background: var(--surface); } }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.bar .inner > * { flex: 1; }
.tabs .inner button { border: 0; background: transparent; font-family: var(--font-ui); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px; min-height: 48px; }
.tabs .inner button.on { color: var(--fg); box-shadow: inset 0 2px 0 var(--tenebres); }

/* Feuille du bas */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 85%; overflow-y: auto; }
.types { display: grid; gap: 8px; }
.types .btn { font-size: 1.2rem; min-height: 58px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.types .btn .cs { font-size: .8rem; color: var(--tenebres); letter-spacing: .08em; text-transform: uppercase; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }
.stepper output { text-align: center; font-family: var(--font-ui); font-weight: 700; font-size: 3rem; font-variant-numeric: tabular-nums; }
.stepper .btn { font-size: 1.8rem; min-height: 64px; }

/* Titres */
.titles { display: grid; gap: 10px; }
.title-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.title-card.lum { border-color: var(--lumiere); }
.title-card.ten { border-color: var(--tenebres); }
.title-card .t { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.title-card.lum .t { color: var(--lumiere); }
.title-card.ten .t { color: var(--tenebres); }
.title-card .w { font-family: var(--font-ui); font-weight: 700; font-size: 1.2rem; }
.title-card .why { font-size: .85rem; color: var(--muted); }

.stat { display: flex; gap: 12px; flex-wrap: wrap; }
.stat div { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-ui); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .8rem; color: var(--muted); }

/* Record Tracks */
.record { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(16,13,11,.92); text-align: center; padding: 24px; pointer-events: none; animation: fadeout 3.2s forwards; }
.record .big { font-family: var(--font-display); font-size: 3rem; color: var(--lumiere); line-height: 1; }
.record .clap { font-size: 3.5rem; animation: clap .35s infinite alternate; }
@keyframes clap { from { transform: scale(1) rotate(-8deg); } to { transform: scale(1.25) rotate(8deg); } }
@keyframes fadeout { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .record .clap, .p.flash { animation: none; } .record { animation: fadeout 3.2s steps(1) forwards; } }
.reveal { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 16px; text-align: center; background: radial-gradient(circle at 50% 40%, var(--surface-2), var(--bg) 70%); overflow: hidden; cursor: pointer; animation: rv-in .3s ease-out; }
.reveal.out { animation: rv-out .25s forwards; }
.reveal .rays { position: absolute; top: 40%; left: 50%; width: 220vmax; height: 220vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, var(--glow) 0deg 8deg, transparent 8deg 24deg); opacity: .14; animation: spin 14s linear infinite; pointer-events: none; }
.reveal.lum { --glow: var(--lumiere); } .reveal.ten { --glow: var(--tenebres); } .reveal.fun { --glow: var(--fg); }
.reveal .stage { position: relative; width: 160px; height: 160px; display: grid; place-items: center; }
.reveal .emoji { font-size: 6.5rem; line-height: 1; animation: pop .9s cubic-bezier(.2, 1.6, .4, 1) both, wobble 1.6s .9s ease-in-out infinite; }
.reveal .spark { position: absolute; top: 50%; left: 50%; font-size: 1.3rem; opacity: 0; animation: burst 1.1s .35s ease-out forwards; }
.reveal .kicker { position: relative; font-family: var(--font-ui); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: .85rem; color: var(--muted); animation: up .5s .5s both; }
.reveal .ttl { position: relative; font-family: var(--font-display); font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1; text-wrap: balance; color: var(--fg); animation: up .5s .65s both; }
.reveal.lum .ttl { color: var(--lumiere); } .reveal.ten .ttl { color: var(--tenebres); }
.reveal .who { position: relative; font-family: var(--font-ui); font-weight: 700; font-size: 1.8rem; animation: up .5s .85s both; }
.reveal .why { position: relative; color: var(--muted); font-size: .95rem; max-width: 30ch; animation: up .5s 1s both; }
.reveal .tap { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-size: .8rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; animation: up .5s 1.6s both; }
@keyframes rv-in { from { opacity: 0; } } @keyframes rv-out { to { opacity: 0; transform: scale(1.05); } }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.06); } }
@keyframes burst { 0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-120px); } }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .reveal, .reveal *, .reveal .rays { animation: none !important; opacity: 1; } .reveal .spark { display: none; } }
.reveal .pitch { width: min(320px, 90vw); height: 160px; display: block; }
.reveal .goal { position: absolute; right: 0; top: 30px; font-size: 6rem; line-height: 1; }
.reveal .ball { position: absolute; left: 0; top: 90px; font-size: 2.6rem; animation: shot 1.9s cubic-bezier(.3,.1,.4,1) both; }
.reveal .bong { position: absolute; right: 10px; top: -10px; font-family: var(--font-display); font-size: 2.6rem; color: var(--lumiere); opacity: 0; animation: bong 1.2s 1s both; }
.reveal.anim-foot .goal { animation: shake .5s 1s; }
@keyframes shot { 0% { transform: translate(0, 0) rotate(0); } 52% { transform: translate(calc(min(320px, 90vw) - 120px), -40px) rotate(540deg); } 100% { transform: translate(40px, 30px) rotate(900deg); opacity: .5; } }
@keyframes bong { 0% { opacity: 0; transform: scale(.4) rotate(-10deg); } 25% { opacity: 1; transform: scale(1.25) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(-4deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-4deg); } 40% { transform: translateX(7px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.reveal.anim-foot .kicker { animation-delay: 1.6s; } .reveal.anim-foot .ttl { animation-delay: 1.75s; } .reveal.anim-foot .who { animation-delay: 1.95s; } .reveal.anim-foot .why { animation-delay: 2.1s; }
.reveal.anim-blackout { background: #000; }
.reveal.anim-blackout .rays { display: none; }
.reveal.anim-blackout .stage, .reveal.anim-blackout .kicker, .reveal.anim-blackout .ttl, .reveal.anim-blackout .who, .reveal.anim-blackout .why { animation: fadein 1s both; }
.reveal.anim-blackout .stage { animation-delay: 1.4s; } .reveal.anim-blackout .kicker { animation-delay: 1.8s; } .reveal.anim-blackout .ttl { animation-delay: 2.1s; } .reveal.anim-blackout .who { animation-delay: 2.5s; } .reveal.anim-blackout .why { animation-delay: 2.8s; }
.reveal.anim-blackout .emoji { animation: none; filter: drop-shadow(0 0 18px var(--fg)); }
@keyframes fadein { from { opacity: 0; } }
/* Le Maudit : des dés qui roulent, que des croix */
.reveal .dice { display: flex; gap: 10px; justify-content: center; width: min(340px, 92vw); height: 110px; align-items: center; }
.reveal .die { width: 52px; height: 52px; border-radius: 10px; background: #f4efe6; color: #b3121b; font-size: 2rem; font-weight: 900; display: grid; place-items: center; box-shadow: 0 4px 0 #9b9384, 0 0 18px rgba(179,18,27,.5); animation: roll .9s calc(var(--i) * .18s) cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes roll { 0% { opacity: 0; transform: translate(-160px, -60px) rotate(-540deg) scale(.5); } 70% { opacity: 1; transform: translate(6px, 4px) rotate(12deg); } 100% { transform: translate(0, 0) rotate(0); } }

const G = Object.fromEntries(GAMES.map(g => [g.id, g]));
const PTS = { 1: 3, 2: 2, 3: 1 };
const isCulSec = (gm, type) => !!(G[gm]?.types || []).find(t => t.id === type && t.cs);

/* ---------- Stockage : base partagée si dispo, sinon ce téléphone ---------- */
const LS = "lostenebros-v1";
const state = { players: {}, soirees: {}, parties: {}, records: {} };
const COLLS = ["players", "soirees", "parties", "records"];
let mode = "pending"; // pending | db | local
let db = null, canWrite = true;
const queues = {};
const inflight = {}; // écritures en cours, par document
// Ce qui n'est pas encore arrivé dans la base partagée. Gardé sur le téléphone :
// survit à une coupure réseau ou à un rechargement, et repart dès que ça revient.
const DIRTY = LS + "-attente";
let dirty = {};
let offline = false, retryTimer = null, retryDelay = 2000;

function loadLocal() {
  try { const raw = localStorage.getItem(LS); if (raw) Object.assign(state, JSON.parse(raw)); } catch (e) {}
  try { dirty = JSON.parse(localStorage.getItem(DIRTY) || "{}") || {}; } catch (e) { dirty = {}; }
}
function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
}
function saveDirty() {
  try { localStorage.setItem(DIRTY, JSON.stringify(dirty)); } catch (e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function mark(coll, id, kind) {
  const key = coll + "/" + id;
  dirty[key] = (dirty[key] || 0) + 1; saveDirty();
  if (mode === "db") write(coll, id, kind);
}
function put(coll, id, data) {
  state[coll][id] = data;
  saveLocal();
  mark(coll, id, "put");
  render();
}
function remove(coll, id) {
  delete state[coll][id];
  saveLocal();
  mark(coll, id, "del");
  render();
}
function write(coll, id) {
  const key = coll + "/" + id;
  if (inflight[key] > 0) { queues[key + "#again"] = true; return; } // une écriture part déjà : on renverra la dernière version juste après
  inflight[key] = 1;
  const ver = dirty[key];
  const prev = queues[key] || Promise.resolve();
  queues[key] = prev.then(async () => {
    const ref = db.doc(key);
    const send = () => state[coll][id] ? ref.set(JSON.parse(JSON.stringify(state[coll][id]))) : ref.delete();
    try {
      try { await send(); }
      catch (e) {
        if (!e || e.code !== "unavailable") throw e;
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
        await send();
      }
      if (dirty[key] === ver) { delete dirty[key]; saveDirty(); }
      if (offline) { offline = false; retryDelay = 2000; render(); }
    } catch (e) {
      if (e && e.code === "invalid_argument") { canWrite = false; delete dirty[key]; saveDirty(); toast("Tu peux consulter, mais pas modifier les scores."); render(); }
      else { if (!offline) { offline = true; render(); } scheduleRetry(); }
    }
  }).finally(() => {
    inflight[key] = 0;
    if (queues[key + "#again"]) { delete queues[key + "#again"]; if (dirty[key] && !offline) write(coll, id); }
  });
}
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = null; flush(); }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 20000);
}
function flush() {
  if (mode !== "db" || !canWrite) return;
  for (const key of Object.keys(dirty)) { const i = key.indexOf("/"); write(key.slice(0, i), key.slice(i + 1)); }
}
window.addEventListener("online", () => { retryDelay = 2000; flush(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && offline) flush(); });

function listen(c) {
  db.collection(c).onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = JSON.parse(JSON.stringify(d.data())); });
    // un document pas encore envoyé (ou en cours) garde sa version du téléphone, suppressions comprises
    for (const key of Object.keys(dirty).concat(Object.keys(inflight).filter(k => inflight[k] > 0))) {
      const i = key.indexOf("/"); if (key.slice(0, i) !== c) continue;
      const id = key.slice(i + 1);
      if (state[c][id]) next[id] = state[c][id]; else delete next[id];
    }
    state[c] = next; saveLocal(); render();
  }, () => { setTimeout(() => listen(c), 3000); });
}

async function connect() {
  let cl = null;
  try { cl = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { cl = null; }
  if (!cl) { mode = "local"; render(); return; }
  db = cl; mode = "db";
  try {
    const user = await window.claude.use("user");
    const w = user ? await user.can("data.write") : null;
    if (w === false) canWrite = false;
  } catch (e) {}
  // ce qui attendait (avant la connexion, ou depuis une coupure) part maintenant
  flush();
  for (const c of COLLS) listen(c);
  render();
}

/* ---------- Calculs ---------- */
// pendant la soirée, les vaincus du Rituel portent leur nom de la honte
const name = id => { const s = activeSoiree(); return (s && s.honte && s.honte[id]) || state.players[id]?.name || "?"; };
const activeSoiree = () => Object.values(state.soirees).filter(s => !s.closed).sort((a, b) => b.date.localeCompare(a.date))[0] || null;
const partiesOf = sid => Object.values(state.parties).filter(p => p.soireeId === sid).sort((a, b) => a.started - b.started);

// Ténèbres = les gorgées bues. Un cul sec pèse 10 (décision de Clément).
// Quand l'appli connaît les vraies gorgées (mini-jeux, cartes de Tracks, doigts de Qui pourrait), elle les prend ;
// sinon chaque type de gamelle a sa valeur d'après les règles (valise perdue = 4 gorgées…).
const CS_POIDS = 10;
const GORGEES = { valise: 4, taptap: 4, theme: 4, pouvoir: 1, merde: 1, merdebois: 1, duel: 3, dernier: 1, gorgee: 1, sort: 1, accuse: 2, manche: 1, erreur: 2, tp: 2, dx: 2, ouinon: 2, sept: 3, quiz: 3, qp: 1, mini: 2 };
function poids(game, g) {
  if (isCulSec(game, g.type)) return CS_POIDS;
  if (g.g) return g.g;
  if (g.n) return g.n;
  if (g.type === "demasque") return 2;
  return GORGEES[g.type] || 1;
}
function gamelleCounts(p) {
  const c = {}; (p.players || []).forEach(id => c[id] = 0);
  (p.gamelles || []).forEach(g => { if (g.p in c) c[g.p] += poids(p.game, g); });
  return c;
}
// 7 secondes, OUI ou NON : le podium va à ceux qui ont le plus de réussites / de oui
function okCounts(p) { const c = {}; (p.players || []).forEach(id => c[id] = 0); (p.turns || []).forEach(x => { if (x.ok && x.p in c) c[x.p]++; }); return c; }
function partiePlaces(p) {
  const g = G[p.game]; if (g.mode !== "gamelle") return p.places || {};
  if (g.rank === "ok") { const c = okCounts(p); const neg = {}; Object.keys(c).forEach(k => neg[k] = -c[k]); return placesFromCounts(neg); }
  return placesFromCounts(gamelleCounts(p));
}
function placesFromCounts(counts) {
  // moins de gamelles = mieux ; ex-æquo partagent la place
  const ids = Object.keys(counts); const out = {};
  ids.forEach(id => { out[id] = 1 + ids.filter(o => counts[o] < counts[id]).length; });
  return out;
}
/* Fiche joueur : tout ce qu'il a fait depuis le début */
function profileHTML(id) {
  const ps = Object.values(state.parties).filter(p => (p.players || []).includes(id) || (p.gamelles || []).some(g => g.p === id));
  const done = ps.filter(p => p.status === "done" && (p.players || []).includes(id));
  const nbS = Object.values(state.soirees).filter(s => (s.playerIds || []).includes(id)).length;
  const { pts, gam, cs } = totals(ps);
  const wins = done.filter(p => (p.places || {})[id] === 1).length;
  const per = {};
  done.forEach(p => { const r = per[p.game] = per[p.game] || { n: 0, pts: 0, win: 0, gam: 0 }; r.n++; r.pts += (p.points || {})[id] || 0; if ((p.places || {})[id] === 1) r.win++; });
  ps.forEach(p => (p.gamelles || []).forEach(g => { if (g.p === id) { const r = per[p.game] = per[p.game] || { n: 0, pts: 0, win: 0, gam: 0 }; r.gam++; } }));
  const rows = Object.entries(per).sort((a, b) => b[1].pts - a[1].pts);
  const avg = ([, r]) => r.n ? r.pts / r.n : 0;
  const fort = rows.filter(([, r]) => r.n >= 2).sort((a, b) => avg(b) - avg(a))[0];
  const noire = rows.filter(([g, r]) => G[g].mode === "gamelle" && r.n >= 2).sort((a, b) => b[1].gam / b[1].n - a[1].gam / a[1].n)[0];
  const tally = {}; Object.values(state.soirees).forEach(s => (s.titles || []).forEach(t => { if (t.who.includes(id)) { tally[t.t] = tally[t.t] || { e: t.e, n: 0 }; tally[t.t].n++; } }));
  const rec = state.records.tracks;
  return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-label="Fiche de ${esc(name(id))}">
    <h3>${esc(name(id))}</h3>
    <div class="stat">
      <div><b>${nbS}</b><span>soirées</span></div><div><b>${pts[id] || 0}</b><span>points</span></div><div><b>${wins}</b><span>victoires</span></div>
      <div><b>${gam[id] || 0}</b><span>châtiments</span></div><div><b>${cs[id] || 0}</b><span>culs secs</span></div><div><b>${nbS ? ((pts[id] || 0) / nbS).toFixed(1) : "—"}</b><span>pts / soirée</span></div>
    </div>
    ${fort || noire || (rec && rec.playerId === id) ? `<div class="facts">
      ${fort ? `<p>💪 Son jeu fort : <b>${esc(G[fort[0]].name)}</b> (${avg(fort).toFixed(1)} pts par partie)</p>` : ""}
      ${noire && noire[1].gam ? `<p>🕳️ Sa bête noire : <b>${esc(G[noire[0]].name)}</b> (${(noire[1].gam / noire[1].n).toFixed(1)} châtiments par partie)</p>` : ""}
      ${rec && rec.playerId === id ? `<p>👏 Détient le record Tracks : <b>${rec.value} cartes</b></p>` : ""}</div>` : ""}
    <h4 class="sub">Titres</h4>
    ${Object.keys(tally).length ? `<div class="row">${Object.entries(tally).sort((a, b) => b[1].n - a[1].n).map(([t, v]) => `<span class="chip on">${esc(v.e || "🏆")} ${esc(t)}${v.n > 1 ? ` ×${v.n}` : ""}</span>`).join("")}</div>` : `<p class="muted small">Aucun titre pour l'instant.</p>`}
    <h4 class="sub">Par jeu</h4>
    ${rows.length ? `<table class="pj"><tr><td>Jeu</td><td>Parties</td><td>Pts</td><td>1er</td><td>Gam.</td></tr>${rows.map(([g, r]) => `<tr><td>${esc(G[g].name)}</td><td>${r.n}</td><td>${r.pts}</td><td>${r.win}</td><td>${G[g].mode === "gamelle" ? r.gam : "—"}</td></tr>`).join("")}</table>` : `<p class="muted small">Pas encore de partie.</p>`}
    <button class="btn ghost" data-act="sheet-close">Fermer</button></div></div>`;
}
function hasPlayed(id) { return Object.values(state.soirees).some(s => (s.playerIds || []).includes(id)) || Object.values(state.parties).some(p => (p.players || []).includes(id)); }
// classement « à la compétition » : on garde les ex-æquo groupés (1, 1, 3)
function rerank(places) {
  const out = {}; let prev = null, rank = 0;
  Object.entries(places).sort((a, b) => a[1] - b[1]).forEach(([id, pl], i) => { if (pl !== prev) rank = i + 1; prev = pl; out[id] = rank; });
  return out;
}
function pointsFromPlaces(places) {
  const pts = {}; Object.entries(places).forEach(([id, pl]) => pts[id] = PTS[pl] || 0); return pts;
}
function totals(parties) {
  const pts = {}, gam = {}, cs = {};
  parties.forEach(p => {
    if (p.status === "done") Object.entries(p.points || {}).forEach(([id, v]) => pts[id] = (pts[id] || 0) + v);
    (p.gamelles || []).forEach(g => {
      gam[g.p] = (gam[g.p] || 0) + poids(p.game, g);
      if (isCulSec(p.game, g.type)) cs[g.p] = (cs[g.p] || 0) + 1;
    });
  });
  return { pts, gam, cs };
}
function sortBoard(map, ids) {
  return ids.map(id => [id, map[id] || 0]).sort((a, b) => b[1] - a[1] || name(a[0]).localeCompare(name(b[0])));
}

function computeTitles(sid) {
  const s = state.soirees[sid]; const ps = partiesOf(sid); const ids = s.playerIds;
  const { pts, gam, cs } = totals(ps);
  const out = [];
  const top = (map) => { const max = Math.max(0, ...ids.map(i => map[i] || 0)); return max > 0 ? ids.filter(i => (map[i] || 0) === max) : []; };
  const lum = top(pts); if (lum.length) out.push({ k: "lum", e: "👑", t: "Le Porteur de Lumière", who: lum, why: `${pts[lum[0]]} points, le meilleur de la soirée` });
  const ten = top(gam); if (ten.length) out.push({ k: "ten", e: "😈", t: "Le Roi des Ténèbres", who: ten, why: `${gam[ten[0]]} points de Ténèbres : c'est lui qui va envoyer les ténèbres` });
  // L'Échappé : le moins de gamelles, parmi ceux qui ont joué au moins la moitié des parties (pas celui qui est arrivé à minuit)
  const played = {}; ps.forEach(p => (p.players || []).forEach(id => played[id] = (played[id] || 0) + 1));
  const need = Math.max(2, Math.ceil(ps.length / 2)), elig = ids.filter(i => (played[i] || 0) >= need);
  if (ps.length >= 3 && elig.length >= 2) {
    const min = Math.min(...elig.map(i => gam[i] || 0)), esc = elig.filter(i => (gam[i] || 0) === min);
    if (esc.length < elig.length) out.push({ k: "esc", e: "🏃", t: "L'Échappé", who: esc, why: min ? `Seulement ${min} point${min > 1 ? "s" : ""} de Ténèbres de toute la soirée : il a tout esquivé` : "Pas un seul châtiment de la soirée : il a tout esquivé" });
  }
  const count = (game, type) => { const m = {}; ps.filter(p => p.game === game).forEach(p => (p.gamelles || []).forEach(g => { if (g.type === type) m[g.p] = (m[g.p] || 0) + 1; })); return m; };
  const fun = (emoji, t, map, min, why, anim) => { const w = ids.filter(i => (map[i] || 0) >= min); if (w.length) out.push({ k: "fun", e: emoji, t, who: w, why, anim }); };
  const add = (...maps) => { const m = {}; maps.forEach(x => Object.entries(x).forEach(([k, v]) => m[k] = (m[k] || 0) + v)); return m; };
  fun("🐻", "L'Ours", cs, 5, "5 culs secs ou plus dans la soirée");
  fun("💩", "La Merde éternelle", count("biscit", "merde"), 3, "Devenu la merde 3 fois au Biscit");
  fun("🥅", "Le Roi des Poteaux carrés", count("purple", "poteau"), 3, "3 poteaux au Purple. Comme Sainté en 76.", "foot");
  fun("🤥", "Le Bluffeur fou", add(count("pyramide", "demasque"), count("kinito", "demasque")), 8, "Démasqué 8 fois dans la soirée (Pyramide et Kinito) : le nez s'allonge", "nez");
  // Tracks : désigner quelqu'un qui n'a plus de carte (celui qui désigne prend cul sec)
  const oublis = count("tracks", "cs");
  const blackout = {}; ids.forEach(i => { if ((oublis[i] || 0) >= 5) blackout[i] = 1; });
  fun("⬛", "Le Black-out", blackout, 1, "A désigné 5 fois quelqu'un qui n'avait plus de carte à Tracks : plus rien ne s'imprime", "blackout");
  const dory = {}; Object.entries(oublis).forEach(([i, v]) => { if (v >= 3 && !blackout[i]) dory[i] = v; });
  fun("🐠", "Dory", dory, 3, "A désigné 3 fois quelqu'un qui n'avait plus de carte à Tracks");
  fun("🪓", "Le Bûcheron", count("barbu", "chute"), 3, "A fait tomber les cartes du Barbu 3 fois");
  const maudit = {}; ps.filter(p => p.game === "kinito").forEach(p => {
    let last = null, run = 0; (p.gamelles || []).forEach(g => { run = g.p === last ? run + 1 : 1; last = g.p; if (run >= 4) maudit[g.p] = 1; });
  });
  fun("🎲", "Le Maudit", maudit, 1, "4 manches du Kinito perdues d'affilée", "des");
  fun("⚖️", "Robespierre", count("kinito", "accuse"), 6, "A accusé à tort 6 fois au Kinito : la Terreur est en marche", "guillotine");
  const meme = {}; ps.filter(p => p.game === "meme" && p.status === "done").forEach(p => Object.entries(p.places || {}).forEach(([id, pl]) => { if (pl === 1) meme[id] = (meme[id] || 0) + 1; }));
  fun("🃏", "Le Bouffon des Ténèbres", meme, 3, "3 fois 1er au Make It Meme");
  const pmu = {}; ps.filter(p => p.game === "pmu" && p.status === "done").forEach(p => Object.entries(p.places || {}).forEach(([id, pl]) => { if (pl === 1) pmu[id] = (pmu[id] || 0) + 1; }));
  fun("🐎", "Jolly Jumper", pmu, 4, "A misé sur le bon as 4 fois au PMU");
  // séries de réussites (7 secondes, Quiz) : 8 d'affilée pour le même joueur dans la soirée
  const streak = (game) => { const best = {}, run = {}; ps.filter(p => p.game === game).sort((a, b) => a.started - b.started).forEach(p => (p.turns || []).forEach(x => { run[x.p] = x.ok ? (run[x.p] || 0) + 1 : 0; best[x.p] = Math.max(best[x.p] || 0, run[x.p]); })); return best; };
  fun("⚡", "Flash", streak("sept"), 5, "5 réussites d'affilée au 7 secondes");
  fun("🔬", "Jamy", streak("quiz"), 5, "5 bonnes réponses d'affilée au Quiz");
  const nons = {}; ps.filter(p => p.game === "ouinon").forEach(p => (p.turns || []).forEach(x => { if (!x.ok) nons[x.p] = (nons[x.p] || 0) + 1; }));
  fun("🐓", "Le Gaulois réfractaire", nons, 6, "A dit non 6 fois au OUI ou NON Sans Débattre");
  fun("🐟", "Le Saumon", count("tp", "tp"), 6, "Minoritaire 6 fois au Tu préfères : toujours à contre-courant");
  const fingers = {}; ps.filter(p => p.game === "qp").forEach(p => (p.gamelles || []).forEach(g => { if (g.type === "qp") fingers[g.p] = (fingers[g.p] || 0) + (g.g || 1); }));
  fun("🤠", "Wanted", fingers, 8, "Désigné par 8 doigts au Qui pourrait");
  fun("🍷", "Anton Ego", count("dx", "dx"), 8, "A fait descendre la note 8 fois au C'est un 10 mais…");
  return out;
}

    x.fillStyle = "#e8c96b"; x.beginPath(); x.arc(W - 150, 130, 46, 0, Math.PI * 2); x.fill();
    x.fillStyle = T.bg[0]; x.beginPath(); x.arc(W - 130, 116, 42, 0, Math.PI * 2); x.fill();
  } else if (T.decor === "candles") {
    for (const cx of [130, W - 130]) {
      const g = x.createRadialGradient(cx, H - 120, 0, cx, H - 120, 130); g.addColorStop(0, "rgba(255,190,90,.30)"); g.addColorStop(1, "rgba(255,190,90,0)"); x.fillStyle = g; x.fillRect(cx - 140, H - 260, 280, 260);
      x.fillStyle = "#e9dcc6"; x.fillRect(cx - 12, H - 112, 24, 64);
      x.fillStyle = "#ffcf6a"; x.beginPath(); x.ellipse(cx, H - 128, 8, 17, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff4d0"; x.beginPath(); x.ellipse(cx, H - 123, 3, 8, 0, 0, Math.PI * 2); x.fill();
    }
  } else if (T.decor === "hatch") {
    x.strokeStyle = "rgba(0,0,0,.05)"; x.lineWidth = 1; for (let i = -H; i < W; i += 9) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + H, H); x.stroke(); }
  } else if (T.decor === "scan") {
    x.fillStyle = "rgba(255,255,255,.035)"; for (let y = 0; y < H; y += 6) x.fillRect(0, y, W, 2);
  } else if (T.decor === "grunge") {
    for (let i = 0; i < 1400; i++) { x.fillStyle = `rgba(255,255,255,${rnd() * .07})`; x.fillRect(rnd() * W, rnd() * H, rnd() * 4 + 1, rnd() * 4 + 1); }
  } else if (T.decor === "picado") {
    const cols = ["#ff3d7f", "#ffb000", "#18c8b4", "#b06cff"];
    for (let i = 0; i < 14; i++) { x.fillStyle = cols[i % 4]; const w = W / 14; x.beginPath(); x.moveTo(i * w, 0); x.lineTo((i + 1) * w, 0); x.lineTo((i + .5) * w, 64); x.closePath(); x.fill(); }
  }
  x.restore();
}
async function sendRecap(sid, canvas, how) {
  const s = state.soirees[sid];
  const file = "los-tenebros-" + (s.date || "").slice(0, 10) + ".png";
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  // Partager : le menu de partage du téléphone, qui propose WhatsApp, Snap, Insta, Facebook…
  if (how !== "save") {
    try {
      const f = new File([blob], file, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  // Télécharger (ou partage indisponible ici) : enregistrer l'image
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      await dl.save({ filename: file, data: blob });
      toast(how === "save" ? "Image enregistrée." : "Image enregistrée : ajoute-la depuis ta galerie dans WhatsApp, Snap, Insta…");
      return;
    }
  } catch (e) { if (e && e.code === "declined") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); } catch (e) {}
  toast("Si rien ne se passe, appuie longtemps sur l'image pour l'enregistrer.");
}

function addGamelle(pid, player, type, n) {
  const p = JSON.parse(JSON.stringify(state.parties[pid]));
  const gm = { p: player, type, t: Date.now() }; if (n) gm.n = n;
  p.gamelles = (p.gamelles || []).concat(gm);
  put("parties", pid, p);
  const btn = app.querySelector(`.p[data-id="${player}"]`); if (btn) { btn.classList.remove("flash"); void btn.offsetWidth; btn.classList.add("flash"); }
  if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
  if (n && p.game === "tracks") {
    const rec = state.records.tracks;
    if (!rec || n > rec.value) {
      put("records", "tracks", { value: n, playerId: player, date: new Date().toISOString(), soireeId: p.soireeId });
      celebrate(n);
    }
  }
  setTimeout(() => checkLiveTitles(p.soireeId), n && p.game === "tracks" ? 3400 : 300);
}
function celebrate(n) {
  const el = document.createElement("div"); el.className = "record"; el.setAttribute("role", "alert");
  el.innerHTML = `<div class="clap">👏👏👏</div><div class="big">Nouveau record !</div><div class="num" style="font-size:2rem">${n} cartes</div><div class="muted">Tout le monde applaudit en chœur.</div>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3300);
  play("applause");
}
/* Règles des jeux (reprises des fiches validées) */
const RULES = {"rituel": "<p><b>Joueurs :</b> 4 et plus, en 2 équipes tirées au sort (3 équipes possibles à partir de 9).</p><p><b>Le plateau :</b> 12 cartes face cachée : les mini-jeux, le Pacte et la Malédiction. Chaque équipe à son tour en retourne une et relève le défi. Après 8 cartes retournées, la finale se lance toute seule entre les deux premières équipes : duel, super duel (2 duels) ou méga duel (3 duels) selon le nombre de joueurs. Les thèmes sont annoncés d'avance, chaque joueur ne peut être champion qu'une fois, la Bougie ou le Tir à la corde au hasard, 3 points par duel gagné.</p><p><b>Le téléphone tourne :</b> c'est l'équipe adverse qui lit les questions et arbitre. Les réponses sont cachées : il faut maintenir le doigt pour les voir.</p><p><b>Les défis :</b> Quiz éclair, 7 secondes (+3 si tout le monde réussit), Unanimité, Quitte ou double, Mime (+4), Le Mot de passe, Enchères (0,25 par réponse citée, +3 si la mise est atteinte, −5 sinon), Qui suis-je ? (personnalités et personnages de fiction, 1 point par personnage trouvé en 60 s), Le Juste prix (+3 à 10 % près, +1 à 25 % près ; pour une année : +3 pile, +1 à 2 ans près).</p><p><b>Cartes spéciales</b> : le Pacte (un cul sec pour 3 points) et la Malédiction (un adversaire ne joue pas le prochain défi de son équipe).</p><p><b>Fin :</b> l'équipe gagnante distribue autant de gorgées que l'écart de points (15 max) à la dernière équipe. Les perdants portent un nom de la honte dans l'appli jusqu'à la fin de la soirée. Titres : 🏆 Les Élus, ⚔️ Le Champion (le plus de duels gagnés).</p><p><b>Comptage :</b> les gorgées et culs secs du Rituel comptent dans les Ténèbres. Le Rituel ne donne pas de points au classement de la soirée.</p>", "pmu": "<p><b>Joueurs :</b> illimité (tout le monde peut miser)</p><p><b>Matériel :</b> un jeu de cartes classique, un maître du jeu</p><h4>Mise en place</h4><ul><li>Les 4 as (♥ ♣ ♠ ♦) sont les chevaux, alignés sur la ligne de départ en bas de la table.</li><li>7 à 8 cartes sont posées face cachée le long de la table : c'est la piste.</li></ul><h4>Mises</h4><ul><li>Chaque joueur mise un nombre de gorgées sur <b>un</b> as, puis les boit tout de suite.</li><li>Plusieurs joueurs peuvent miser sur le même as.</li></ul><h4>Déroulement</h4><ol><li>Le maître du jeu retourne les cartes du paquet une par une.</li><li>L'as de la couleur tirée avance d'une case.</li><li>Quand les 4 as ont tous dépassé une même case de la piste, on retourne la carte de cette case : l'as de sa couleur recule d'une case.</li></ol><h4>Fin de partie</h4><ul><li>Le premier as qui <b>dépasse</b> la dernière carte de la piste gagne.</li><li>Chaque joueur qui avait misé dessus distribue <b>sa mise × 3</b> gorgées (2 gorgées misées = 6 à distribuer).</li></ul>", "barbu": "<p><b>Le jeu phare de Los Ténébros</b></p><h4>Mise en place</h4><ul><li>Une bouteille debout au milieu de la table.</li><li>Toutes les cartes sont étalées face cachée en cercle au pied de la bouteille.</li></ul><h4>Déroulement</h4><ul><li>À son tour, un joueur tire une carte du cercle et la pose sur le goulot de la bouteille, en laissant toujours <b>deux bords dépasser</b>.</li><li>La règle de la carte ne s'active qu'une fois la carte posée sur la bouteille.</li><li><b>Faire tomber les cartes</b> : cul sec, et toutes les règles en cours (cartes posées sur la bouteille) sont annulées. Les cartes tombées sont retirées du jeu ou remises dans le cercle, au choix du groupe.</li><li><b>Briser le cercle</b> (laisser un trou dans le cercle) : cul sec, mais la partie continue.</li><li><b>Fin de partie</b> : quand toutes les cartes ont été posées. Dans ce cas, tous les joueurs gagnent, mais c'est extrêmement rare.</li><li>Le jeu se joue avec n'importe quel paquet, complet ou non. Dans les faits, il compte surtout pour les <b>pénalités</b> (les perdants), plutôt que pour les victoires.</li></ul><h4>Les cartes</h4><table><tr><td>Carte</td><td>Nom</td><td>Règle</td></tr><tr><td>As noir</td><td>—</td><td>Le joueur distribue 1 gorgée</td></tr><tr><td>As rouge</td><td>—</td><td>Le joueur boit 1 gorgée</td></tr><tr><td>2</td><td>Gorgée du peuple</td><td>Tout le monde boit 1 gorgée</td></tr><tr><td>3 noir</td><td>—</td><td>Le joueur distribue 3 gorgées</td></tr><tr><td>3 rouge</td><td>—</td><td>Le joueur boit 3 gorgées</td></tr><tr><td>4</td><td>Tap-tap</td><td>Mini-jeu de rythme. Le premier qui se trompe boit 4 gorgées</td></tr><tr><td>5</td><td>Nouvelle règle</td><td>Le joueur crée une règle libre, sauf une règle qui vise un seul joueur</td></tr><tr><td>6</td><td>Je n'ai jamais / J'ai déjà</td><td>« Je n'ai jamais… » : ceux qui l'ont fait boivent. « J'ai déjà… » : ceux qui ne l'ont pas fait boivent</td></tr><tr><td>7</td><td>La rivière</td><td>Mini-jeu : tout le monde boit en chaîne (voir plus bas)</td></tr><tr><td>8</td><td>Dans ma valise</td><td>Mini-jeu de mémoire. Le premier qui échoue boit 4 gorgées</td></tr><tr><td>9</td><td>Freeze</td><td>Pouvoir permanent (voir plus bas). Celui qui bouge le premier boit 1 gorgée</td></tr><tr><td>10</td><td>Le thème</td><td>Le joueur annonce un thème. Chacun cite un élément différent, le premier qui répète ou ne trouve pas boit 4 gorgées</td></tr><tr><td>Valet</td><td>Snake Eyes</td><td>Pouvoir permanent. Croiser son regard = 1 gorgée</td></tr><tr><td>Dame</td><td>Reine des salopes</td><td>Pouvoir permanent. Ne pas l'insulter en lui parlant = 1 gorgée (n'importe quel joueur peut signaler l'oubli)</td></tr><tr><td>Roi</td><td>Roi des pouces</td><td>Pouvoir permanent. Le dernier à poser son pouce sur la tête boit 1 gorgée</td></tr></table><h4>Détail des mini-jeux</h4><p><b>Tap-tap (4)</b> : tout le monde suit le rythme 2 tapes sur les cuisses, 1 clap. Chacun choisit un signe distinctif (poing levé, etc.). Celui qui a tiré le 4 lance le jeu : 2 tapes + son propre signe, puis 2 tapes + le signe du joueur à qui il passe la main. Ce joueur enchaîne aussitôt de la même manière et passe à qui il veut. Le premier qui se trompe boit 4 gorgées.</p><p><b>La rivière (7)</b> : tout le monde commence à boire en même temps. Celui qui a tiré le 7 s'arrête quand il veut. Le joueur suivant ne peut s'arrêter qu'après lui, le suivant seulement après celui-là, et ainsi de suite. Exception : un joueur qui termine son verre peut s'arrêter, et la rivière continue pour les autres. La chaîne part de celui qui a tiré le 7 et tourne dans le sens des aiguilles d'une montre.</p><p><b>Dans ma valise (8)</b> : « Dans ma valise il y a… » + 1 à 3 mots. Le joueur suivant répète toute la liste et ajoute 1 à 3 mots. Le premier qui se trompe boit 4 gorgées.</p><h4>Pouvoirs permanents (9, Valet, Dame, Roi)</h4><ul><li>Ils ne s'utilisent jamais pendant un mini-jeu (tap-tap, rivière…).</li><li>Ils durent jusqu'à ce que les cartes tombent ou que quelqu'un d'autre tire la même carte.</li><li>Si le détenteur retire la même carte, la pénalité passe à 2 gorgées.</li><li>Des pouvoirs différents se cumulent : un joueur peut être Roi des pouces et Reine des salopes en même temps.</li><li><b>Freeze (9)</b> : le détenteur dit « freeze » à tout moment et tout le monde s'immobilise. Il doit libérer les joueurs au bout de 3 ou 4 secondes. Seul le premier qui bouge boit.</li><li><b>Roi des pouces</b> : utilisable autant de fois qu'il veut, dans la limite du raisonnable.</li></ul>", "meme": "<p><b>Type :</b> jeu mobile (application externe), chaque joueur sur son téléphone</p><h4>Principe</h4><ul><li>Tous les joueurs se connectent à la même partie dans l'application Make It Meme.</li><li>À chaque manche, l'application propose une image de meme et chacun écrit sa légende la plus drôle.</li><li>Tout le monde vote pour les memes des autres.</li><li>L'application affiche un classement final selon les votes.</li></ul><h4>Côté alcool</h4><ul><li>Pas de règle de gorgées fixe : c'est surtout un jeu de vannes, les gorgées sont secondaires.</li><li>Pour le classement Los Ténébros, c'est le classement final de l'appli qui compte.</li></ul>", "toz": "<p><b>Type :</b> application externe de mini-jeux, jouée sur un téléphone</p><h4>Mini-jeux joués par Los Ténébros</h4><p><b>Nos versions maison sont maintenant des jeux à part dans l'app :</b> 7 secondes, OUI ou NON Sans Débattre, Quiz, Tu préfères, Qui pourrait, C'est un 10 mais… (fiches 10 à 15).</p><p><b>Le nombre de gorgées à boire ou à distribuer est toujours indiqué par l'appli Toz.</b></p><table><tr><td>Mini-jeu</td><td>Principe supposé</td><td>Qui boit</td></tr><tr><td><b>7 secondes</b> ⭐ (le favori)</td><td>Un joueur a 7 secondes pour citer 3 choses d'une catégorie (ex. 3 races de chiens)</td><td>Échec : il boit. Réussite : il distribue</td></tr><tr><td><b>OUI ou NON Sans Débattre</b> (dans l'app)</td><td>15 sujets « pour ou contre », du débat de société (peine de mort, euthanasie…) au débat léger (ananas sur la pizza…). L'app vise un joueur à tour de rôle ; au 3, 2, 1 il répond oui ou non, sans débattre</td><td>Oui : il distribue 2 gorgées. Non : il boit 2 gorgées</td></tr><tr><td><b>Quiz</b> (dans l'app)</td><td>Chacun passe 5 fois dans le désordre. Question de culture générale à 4 choix (dont une réponse absurde), de 1 à 6 gorgées selon la difficulté</td><td>Faux : il boit. Bon : il distribue</td></tr><tr><td><b>Tu préfères</b> (dans l'app)</td><td>15 dilemmes A ou B. Bras au milieu, au 3, 2, 1 tout le monde lève (A) ou baisse (B) le bras en même temps, sans discuter</td><td>Les minoritaires boivent 2 gorgées. Égalité parfaite : personne ne boit</td></tr><tr><td><b>Qui pourrait</b> (dans l'app)</td><td>15 questions « Qui pourrait… ? ». Au 3, 2, 1, tout le monde pointe quelqu'un du doigt en même temps, sans discuter</td><td>Le ou les plus désignés boivent 1 gorgée par doigt pointé sur eux</td></tr><tr><td><b>C'est un 10 mais…</b> (dans l'app)</td><td>15 phrases « C'est un 7, mais… » : la note de départ varie et le « mais » est un défaut ou une qualité. L'app vise un joueur à tour de rôle ; au 3, 2, 1 il donne sa nouvelle note, sans réfléchir</td><td>Note qui reste ou monte : il distribue 2 gorgées. Note qui descend : il boit 2 gorgées</td></tr></table>", "biscit": "<p><b>Matériel :</b> 2 dés, une assiette</p><p><b>Fin de partie :</b> aucune. On joue jusqu'à ce qu'on en ait marre ou qu'un joueur abandonne. Pas de gagnant.</p><h4>Déroulement</h4><p>Chacun lance les 2 dés à tour de rôle, dans le sens des aiguilles d'une montre. Le résultat déclenche une règle :</p><table><tr><td>Résultat</td><td>Effet</td><td>Rejoue ?</td></tr><tr><td>Somme 7</td><td><b>Biscit !</b> Le dernier à dire « Biscit » et à poser son doigt sur la tête boit 1 gorgée</td><td>Oui</td></tr><tr><td>Somme 9</td><td>Le joueur <b>précédent</b> boit 1 gorgée</td><td>Oui</td></tr><tr><td>Somme 10</td><td>Le <b>lanceur</b> boit 1 gorgée</td><td>Oui</td></tr><tr><td>Somme 11</td><td>Le joueur <b>suivant</b> boit 1 gorgée</td><td>Oui</td></tr><tr><td>2 + 1</td><td><b>Gorgée du peuple</b> : tout le monde boit</td><td>Non</td></tr><tr><td>Double</td><td>Le lanceur distribue la valeur d'un dé (double 2 = 2 gorgées, double 4 = 4…)</td><td>Oui</td></tr><tr><td>Double 6</td><td>Distribue 6 gorgées et crée une nouvelle règle</td><td>Oui</td></tr><tr><td>Somme 8</td><td><b>Duel</b> (règle ajoutée, très jouée, voir plus bas)</td><td>Non</td></tr><tr><td>Un dé qui montre 3</td><td><b>La merde</b> (voir plus bas)</td><td>Non</td></tr><tr><td>Autre</td><td>Rien</td><td>Non, on passe les dés</td></tr></table><p><b>Combinaisons</b> : quand un lancer déclenche plusieurs règles, elles s'appliquent toutes. Le joueur rejoue si au moins une d'elles fait rejouer.</p><ul><li>3 + 4 : il devient la merde <b>et</b> c'est un Biscit, donc il rejoue (et peut sortir de la merde).</li><li>5 + 5 : il distribue 5 gorgées <b>et</b> en boit 1 (somme 10), puis rejoue.</li><li>4 + 4 : duel <b>et</b> double, donc il rejoue grâce au double.</li></ul><h4>Le duel (somme 8)</h4><ul><li>Le lanceur désigne 2 joueurs (il peut se désigner lui-même).</li><li>Chacun lance un dé, et le plus haut gagne. On compte la valeur du plus haut dé (ex. 2 contre 4 = 4 gorgées).</li><li>En cas d'égalité : quitte ou double, les gorgées sont doublées.</li><li>Le gagnant inflige les gorgées au perdant.</li></ul><h4>La merde</h4><ul><li>« Faire un 3 » = un des dés montre un 3 (la somme ne compte pas).</li><li>Le premier qui fait un 3 devient <b>la merde</b>.</li><li>Tant qu'il ne refait pas un 3, chaque autre joueur qui fait un 3 lui fait boire 1 gorgée.</li><li>Pour sortir de la merde, il doit refaire un 3.</li><li>Un 3 seul ne fait pas rejouer, qu'on soit la merde ou non (sauf combinaison, voir plus haut).</li><li><b>Quinte flush royale</b> (double 3) : chaque 3 compte. La merde en sort puis y retourne aussitôt, et un joueur qui n'était pas la merde y entre puis en sort. Le double distribue aussi 3 gorgées.</li></ul><h4>Règles additionnelles</h4><p>D'autres règles peuvent être ajoutées sur certains chiffres (comme le duel en 8, ou celles créées au double 6).</p>", "kinito": "<p><b>Matériel :</b> 2 dés et un gobelet opaque</p><h4>Lire un lancer</h4><p>Le plus grand dé donne les dizaines et le plus petit les unités : 4 et 1 = 41, 6 et 2 = 62, 2 et 3 = 32.</p><p><b>Ordre, du plus faible au plus fort :</b></p><ol><li>Les nombres simples, dans l'ordre numérique : 31, 32, 41, 42, 43, 51 … 65</li><li>Les doubles, toujours au-dessus des nombres : double 1 &lt; double 2 &lt; … &lt; double 6</li><li><b>Le Kinito (21)</b> : le lancer le plus fort du jeu</li></ol><h4>Déroulement</h4><ol><li>Le joueur secoue les dés sous le gobelet, regarde en cachette et annonce un résultat (vrai ou bluff) au joueur à sa gauche.</li><li>Ce joueur a deux choix :<ul><li><b>Croire</b> : il prend le gobelet, relance obligatoirement les dés (une seule fois) et doit annoncer plus haut. S'il fait moins, il peut accepter son sort et boire, ou bluffer et passer le gobelet au suivant. Une fois l'annonce acceptée, le joueur précédent peut secouer le gobelet : on ne saura jamais ce qu'il avait vraiment.</li><li><b>Dire « menteur ! »</b> : on soulève le gobelet. Si le résultat est inférieur à l'annonce, le menteur boit. Sinon, c'est l'accusateur qui boit. La manche s'arrête là.</li></ul></li><li>Le but : toujours monter et faire croire à l'autre qu'on a plus.</li><li><b>Fin de manche</b> (« menteur » ou sort accepté) : on repart à zéro. Le perdant passe le gobelet, et c'est le joueur suivant qui lance la nouvelle manche.</li></ol><h4>Gorgées</h4><ul><li>Nombre simple : 1 gorgée si on accepte son sort, 2 gorgées s'il y a eu « menteur » (pour le menteur pris ou pour l'accusateur qui s'est trompé)</li><li>Double : la valeur du double annoncé (double 4 = 4 gorgées), multipliée par 2 s'il y a eu « menteur » (double 4 = 8)</li><li><b>Kinito annoncé</b> : cul sec. Celui qui reçoit un Kinito doit faire un Kinito, sinon il accepte et prend cul sec. Il peut aussi dire « menteur » : si l'annonceur bluffait, c'est lui qui prend le cul sec.</li></ul>", "tracks": "<p><b>Matériel :</b> un jeu de cartes</p><p>Un jeu rapide qui fait boire beaucoup, très vite.</p><h4>Mise en place</h4><ul><li>Chaque joueur reçoit 2 cartes, qu'il regarde sans les montrer.</li><li>On retourne une carte sur la table : sa couleur (♥ ♣ ♠ ♦) devient <b>la couleur de la manche</b> et ne change jamais.</li></ul><h4>Déroulement</h4><ul><li>Un maître du jeu (ou tout le monde en chœur) lance le chrono : 5, 4, 3, 2, 1, 0. Le chrono repart à 5 à chaque carte posée.</li><li>N'importe qui pose une carte à n'importe quel moment, sans ordre de tour. Le but est de se débarrasser de ses cartes.</li><li>Cartes jouables :<ul><li>toute carte de la couleur de la manche ;</li><li>une carte de même valeur que la dernière posée (ex. un 4♣ sur un 4♥). La couleur de la manche ne change pas pour autant.</li></ul></li><li>À chaque carte posée, le joueur <b>désigne</b> quelqu'un.</li></ul><h4>Fin de manche et gorgées</h4><ul><li>Quand le chrono arrive à 0 et que plus personne ne peut poser, le <b>dernier désigné</b> boit autant de gorgées qu'il y a de cartes sur la table.</li><li>Désigner un joueur qui n'a plus de cartes : celui qui a désigné prend cul sec.</li><li>Un joueur qui a posé toutes ses cartes est à l'abri jusqu'à la fin de la manche.</li><li><b>Record</b> : chaque fois que le record de gorgées est battu, la taille de la main augmente d'une carte pour tout le monde. <b>Tout le monde félicite et applaudit en chœur le nouveau recordman. Très important.</b></li><li><b>Manche suivante</b> : chacun garde ses cartes non jouées et complète sa main jusqu'à la taille en cours (ex. il me reste 1 carte sur 2, j'en pioche 1).</li><li><b>Fin de partie</b> : quand la main devient trop grosse (souvent vers 7 ou 8 cartes, selon le nombre de joueurs), car les gorgées deviennent énormes.</li></ul>", "purple": "<p><b>Matériel :</b> un jeu de cartes</p><p>Un jeu bien violent.</p><h4>But</h4><p>Aligner <b>3 cartes</b> réussies sur la table pour pouvoir passer son tour.</p><ul><li>Un pari à plusieurs cartes réussi ajoute toutes ses cartes (un sandwich réussi = 3 cartes, donc on peut passer d'un coup).</li><li>On peut continuer à jouer autant qu'on veut : <b>les cartes sur la table passent au joueur suivant</b>, qui démarre avec ce tas et risque autant de gorgées (10 cartes alignées = 10 gorgées en jeu pour le suivant).</li><li>Le paquet n'est pas mélangé à chaque fois : repérer l'ordre des cartes peut aider.</li></ul><h4>Les paris</h4><p>Avant chaque tirage, le joueur annonce un pari :</p><table><tr><td>Pari</td><td>Cartes tirées</td><td>Gagné si…</td></tr><tr><td>Rouge / Noir</td><td>1</td><td>La couleur annoncée sort</td></tr><tr><td>Plus / Moins</td><td>1</td><td>La carte est plus haute / plus basse que la précédente (dès qu'une carte est sur la table)</td></tr><tr><td>Inter / Exter</td><td>1</td><td>La carte tombe entre / en dehors des deux dernières cartes (ex. avec 3 et 6, exter = As, 2, 7 … Roi)</td></tr><tr><td>Purple</td><td>2</td><td>Une rouge et une noire, dans n'importe quel ordre</td></tr><tr><td>Sandwich</td><td>3</td><td>Rouge-Noir-Rouge ou Noir-Rouge-Noir</td></tr><tr><td>Double purple</td><td>4</td><td>Rouge-Noir-Rouge-Noir ou Noir-Rouge-Noir-Rouge, dans cet ordre</td></tr><tr><td>Marine Le Pen</td><td>10</td><td>Majorité de noires</td></tr><tr><td>François Hollande</td><td>10</td><td>Majorité de rouges</td></tr></table><p>L'As compte comme 1 (le plus faible).</p><p><b>Marine Le Pen / François Hollande, le moment solennel</b> : dès qu'une carte peut décider du résultat, celui qui tire annonce d'un ton très solennel, façon Denis Brunet : « Cette carte peut déjà être décisive. » En cas de 5-5, on tire une 11e carte : « Cette dernière carte va être décisive. »</p><p><b>Poteau</b> : au plus/moins, une carte de même valeur que la précédente, ou à l'inter/exter, une carte égale à l'une des deux bornes = <b>cul sec</b>. Attention, un exter qui paraît sûr (entre un As et un 2) peut finir en poteau.</p><h4>Erreur</h4><ul><li>Le joueur boit autant de gorgées qu'il y a de cartes sur la table (carte ratée comprise).</li><li>On ramasse toutes les cartes et le joueur repart de zéro, jusqu'à aligner ses 3 cartes.</li></ul>", "pyramide": "<p><b>Matériel :</b> un jeu de cartes</p><p>Un jeu de bluff et de mémoire.</p><h4>Phase 1 : distribuer 4 cartes à chaque joueur</h4><p>On fait le tour des joueurs 4 fois. À chaque tour, le joueur doit deviner sa prochaine carte :</p><table><tr><td>Carte</td><td>Pari</td><td>Si juste</td></tr><tr><td>1re</td><td>Rouge ou noir</td><td>Distribue 1 gorgée</td></tr><tr><td>2e</td><td>Plus ou moins (que sa 1re carte)</td><td>Distribue 2 gorgées</td></tr><tr><td>3e</td><td>Inter ou exter (par rapport à ses 2 premières)</td><td>Distribue 3 gorgées</td></tr><tr><td>4e</td><td>La couleur exacte (♥ ♣ ♠ ♦)</td><td>Distribue 4 gorgées</td></tr></table><p>Si c'est faux, il boit le nombre de gorgées qu'il aurait distribuées. <b>Poteau</b> (égalité au plus/moins ou à l'inter/exter) : cul sec, comme au Purple.</p><h4>Phase 2 : la pyramide</h4><ul><li>On dispose les cartes restantes face cachée en pyramide : une large base, une seule carte au sommet. Le nombre de lignes dépend des cartes qui restent dans le paquet, du nombre de joueurs et de la place sur la table.</li><li>Chaque joueur mémorise ses 4 cartes, puis les pose face cachée devant lui.</li><li>On retourne les cartes de la pyramide une à une, en partant de la base (par le maître du jeu, ou par quelqu'un d'autre si le maître du jeu est trop bourré). On ne retourne la carte suivante que quand tout le monde a fini.</li><li>À chaque carte retournée, n'importe qui peut faire boire un joueur en prétendant avoir une carte de même valeur (ex. « Un 3 ! Toi, tu bois »).</li><li>Une carte en main permet de faire boire <b>une personne</b> par carte retournée : avec deux 3, on peut faire boire deux personnes différentes.</li><li>Tant qu'on n'a pas été traité de menteur, on peut réutiliser la même carte à chaque fois que sa valeur ressort dans la pyramide.</li><li><b>Gorgées</b> : 1 à la 1re ligne, 2 à la 2e, etc. La dernière ligne, c'est cul sec.</li><li>L'accusé peut <b>accepter</b> et boire, ou dire <b>« menteur ! »</b>. Celui qui a fait boire doit alors retourner, du premier coup, la bonne carte devant lui :<ul><li>il ne l'a pas (ou se trompe de carte) : il boit le double ;</li><li>il l'a : l'accusateur boit le double.</li></ul></li><li>Une carte montrée est défaussée. Son propriétaire en pioche une nouvelle, la regarde et la repose face cachée à la même place, en mémorisant laquelle c'est.</li></ul><h4>Fin de partie</h4><p>Une fois la dernière ligne jouée, chaque joueur doit citer ses 4 cartes dans l'ordre. S'il se trompe : cul sec.</p>", "sept": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>L'app désigne un joueur. 30 questions par manche, tout le monde à tour de rôle dans le désordre, jamais deux fois de suite.</li><li>Tu touches « Voir la catégorie », puis tu lances le chrono quand le joueur est prêt.</li><li>Il a 7 secondes pour citer 3 choses de la catégorie (ex. 3 races de chiens).</li><li>Le nombre de gorgées (1 à 6) dépend de la difficulté de la catégorie.</li></ul><h4>Qui boit</h4><ul><li>Réussi : il distribue les gorgées.</li><li>Raté : il boit les gorgées, et ça compte un châtiment.</li></ul><h4>Points</h4><p>Le podium (3/2/1) va à ceux qui ont le plus de réussites, donc ceux qui ont le plus distribué.</p>", "ouinon": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>15 sujets « pour ou contre », du débat de société (peine de mort, euthanasie…) au débat léger (ananas sur la pizza…).</li><li>L'app vise un joueur à tour de rôle, dans le désordre.</li><li>Il répond oui ou non tout de suite, sans débattre.</li></ul><h4>Qui boit</h4><ul><li>Oui : il distribue 2 gorgées.</li><li>Non : il boit 2 gorgées (pas de châtiment).</li></ul><h4>Points</h4><p>En fin de manche, deux classements : le plus de oui (ceux qui distribuent) et le plus de non (ceux qui prennent). Le podium (3/2/1) va au plus de oui.</p>", "quiz": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>L'app désigne un joueur. Chacun passe 5 fois, dans le désordre.</li><li>Question de culture générale à 4 choix, dont une réponse absurde. Les réponses sont mélangées.</li><li>Le joueur répond, tu touches sa réponse et l'app montre si c'est bon.</li><li>Le nombre de gorgées (1 à 6) dépend de la difficulté.</li></ul><h4>Qui boit</h4><ul><li>Bonne réponse : il distribue les gorgées.</li><li>Mauvaise réponse : il boit les gorgées, et ça compte un châtiment.</li></ul><h4>Points</h4><p>Comme les autres jeux à châtiments : moins de châtiments = meilleure place (podium 3/2/1).</p>", "tp": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>15 dilemmes A ou B.</li><li>Tout le monde met le bras tendu au milieu. Au 3, 2, 1, chacun lève le bras en haut (A) ou le baisse (B) en même temps, sans discuter.</li></ul><h4>Qui boit</h4><ul><li>Les minoritaires boivent 2 gorgées, et ça leur compte un châtiment.</li><li>Égalité parfaite : personne ne boit.</li></ul><h4>Points</h4><p>Comme les autres jeux à châtiments : moins de châtiments = meilleure place (podium 3/2/1).</p>", "qp": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>15 questions « Qui pourrait… ? ».</li><li>Au 3, 2, 1, tout le monde pointe quelqu'un du doigt en même temps, sans discuter.</li><li>Tu touches chaque joueur désigné une fois par doigt pointé sur lui.</li></ul><h4>Qui boit</h4><ul><li>Chaque désigné boit 1 gorgée par doigt pointé sur lui, et ça lui compte un châtiment.</li></ul><h4>Points</h4><p>Comme les autres jeux à châtiments : moins de châtiments = meilleure place (podium 3/2/1).</p>", "dx": "<p><b>Type :</b> jeu maison dans l'app (ancien mini-jeu du Toz)</p><h4>Déroulement</h4><ul><li>15 phrases « C'est un 10, mais il/elle… » + un gros défaut. Parfois la note de départ est plus basse avec une qualité (« C'est un 3, mais il/elle est millionnaire »).</li><li>L'app vise un joueur à tour de rôle, dans le désordre.</li><li>Il donne sa nouvelle note tout de suite, sans réfléchir (pas de compte à rebours).</li></ul><h4>Qui boit</h4><ul><li>La note reste ou monte : il distribue 2 gorgées.</li><li>La note descend : il boit 2 gorgées, et ça compte un châtiment.</li></ul><h4>Points</h4><p>Comme les autres jeux à châtiments : moins de châtiments = meilleure place (podium 3/2/1).</p>"};

const SEPT_ROUNDS = 5, SEPT_TIME = 7, SEPT_N = 30;
// ordre de passage : chaque joueur 5 fois, mélangé, jamais deux fois de suite
function septQueue(players, total) {
  const r = total ? Math.ceil(total / players.length) : SEPT_ROUNDS;
  const all = []; players.forEach(id => { for (let i = 0; i < r; i++) all.push(id); });
  for (let tries = 0; tries < 400; tries++) {
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    if (players.length < 2 || all.every((id, i) => i === 0 || all[i - 1] !== id)) break;
  }
  return total ? all.slice(0, total) : all;
}

  const up = Math.cos(e.beta * Math.PI / 180) * Math.cos(e.gamma * Math.PI / 180); // 1 = écran au plafond, −1 = au sol
  if (Math.abs(up) < 0.35) { ritTilt.armed = true; return; }

  const p = state.parties[ui.partieId]; const c = p && p.rit && p.rit.cur;

function announce(t) { revealQueue.push(t); if (!revealing) nextReveal(); }
function nextReveal() {
  const t = revealQueue.shift(); if (!t) { revealing = false; return; }
  revealing = true;
  const el = document.createElement("div"); el.className = "reveal " + (t.k || "fun"); el.setAttribute("role", "alert");
  const sparks = Array.from({ length: 12 }, (_, i) => `<span class="spark" style="--a:${i * 30}deg">${t.k === "ten" ? "🔥" : "✨"}</span>`).join("");
  if (t.anim) el.classList.add("anim-" + t.anim);
  const stage = t.anim === "foot"
    ? `<div class="stage pitch"><span class="goal">🥅</span><span class="ball">⚽</span><span class="bong">BONGGG !</span></div>`
    : t.anim === "des" ? `<div class="stage dice">${[0, 1, 2, 3, 4].map(i => `<span class="die" style="--i:${i}">✖</span>`).join("")}</div>`
    : t.anim === "nez" ? `<div class="stage"><div class="emoji">🤥</div><span class="nose"></span></div>`
    : t.anim === "guillotine" ? `<div class="stage guil"><span class="frame"></span><span class="blade"></span><span class="lunette"></span><span class="basket">🧺</span></div>`
    : `<div class="stage">${sparks}<div class="emoji">${esc(t.e || "🏆")}</div></div>`;
  el.innerHTML = `<div class="rays"></div>${stage}
    <div class="kicker">${t.live ? "Titre débloqué" : "Et le titre revient à…"}</div>
    <div class="ttl">${esc(t.t)}</div><div class="who">${esc(t.who.map(name).join(", "))}</div><div class="why">${esc(t.why)}</div>
    <div class="tap">Touche pour continuer</div>`;
  let done = false;
  const close = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => { el.remove(); nextReveal(); }, 250); };
  // on ignore les taps de la première seconde et demie, pour ne pas fermer l'annonce par erreur en enchaînant
  const shownAt = Date.now(); el.addEventListener("click", () => { if (Date.now() - shownAt > 1500) close(); });
  document.body.appendChild(el);
  play(TITLE_SFX[t.t] || t.k);
  if (t.anim === "foot") setTimeout(() => { if (navigator.vibrate) try { navigator.vibrate([200]); } catch (e) {} }, 1000);
  else if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (e) {}
  if (t.live) setTimeout(close, t.anim ? 6000 : 4500);
}
function checkLiveTitles(sid) {
  const s = state.soirees[sid]; if (!s || s.closed) return;
  const seen = new Set(s.unlocked || []); const fresh = [];
  computeTitles(sid).filter(t => t.k === "fun").forEach(t => t.who.forEach(id => {
    const key = t.t + "|" + id; if (!seen.has(key)) { seen.add(key); fresh.push(Object.assign({}, t, { who: [id], live: true })); }
  }));
  if (!fresh.length) return;
  put("soirees", sid, Object.assign({}, s, { unlocked: Array.from(seen) }));
  fresh.forEach(announce);
}

document.addEventListener("submit", e => {
  const f = e.target.closest("form.add-player"); if (!f) return; e.preventDefault();
  const input = f.querySelector("input"); const n = input.value.trim(); if (!n) return;
  input.value = ""; // vidé avant le re-rendu, sinon le nom reste dans le champ
  const existing = Object.values(state.players).find(p => p.name.toLowerCase() === n.toLowerCase());
  const id = existing ? existing.id : uid();
  if (existing && existing.hidden) put("players", id, Object.assign({}, existing, { hidden: false }));
  if (!existing) put("players", id, { id, name: n, created: new Date().toISOString() });
  if (f.dataset.ctx === "new") { if (!(ui.newSoireePlayers || []).includes(id)) ui.newSoireePlayers = (ui.newSoireePlayers || []).concat(id); }
  else { const s = activeSoiree(); if (s && !s.playerIds.includes(id)) put("soirees", s.id, Object.assign({}, s, { playerIds: s.playerIds.concat(id) })); }
  render();
  const again = document.getElementById(input.id); if (again) again.focus();
});

// Écran toujours allumé tant qu'une soirée est en cours (si le téléphone le permet)
let wakeLock = null;
async function keepAwake() {
  const want = !!activeSoiree() && !document.hidden;
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", () => setTimeout(keepAwake, 0));
